<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>표와 미디어</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            table,
            th,
            td {
                border: 1px solid black;
                border-collapse: collapse;
                padding: 10px;
            }

            hr {
                margin: 20px 0;
            }
        </style>
    </head>
    <body>
        <!-- 표 전체를 감싸는 태그 -->
        <table>
            <!-- caption: 표의 제목 또는 설명 -->
            <caption>
                웹 개발 스터디 시간표
            </caption>
            <!-- thead: 표의 제목 행들을 묶는 영역 -->
            <thead>
                <!-- tr: 표의 한 '행'을 의미 -->
                <tr>
                    <!-- th: 표의 제목 셀 -->
                    <!-- td: 표의 각 셀 -->
                    <th>시간</th>
                    <th>월요일</th>
                    <th>수요일</th>
                    <th>금요일</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1교시</td>
                    <!-- rowspan: 아래쪽 세로로 병합 -->
                    <td rowspan="2">html 기초</td>
                    <td>css 기초</td>
                    <td>javaScript 기초</td>
                </tr>
                <tr>
                    <td>2교시</td>
                    <!-- colspan: 오른쪽 가로로 병합 -->
                    <td colspan="2">미니 프로젝트</td>
                </tr>
            </tbody>
        </table>

        <hr />

        <h1>미디어로 페이지 꾸미기</h1>
        <h2>이미지 넣기</h2>
        <img src="sample/image/river1.PNG" alt="나무와 강" width="500px" />

        <figure>
            <img src="sample/image/river2.png" alt="아침 강" width="500px" />
            <figcaption>딸기</figcaption>
        </figure>

        <h2>오디오 넣기</h2>
        <audio src="sample/audio/major.mp3" controls></audio>

        <h2>비디오 넣기</h2>
        <video src="sample/video/video1.mp4" controls></video>
    </body>
</html>
